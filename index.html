const restStart = async end => { const LN = CAP(); if (!LN) return; try { let pm = await LN.checkPermissions(); if (pm.display !== "granted") pm = await LN.requestPermissions(); if (pm.display !== "granted") return; await LN.createChannel({ id: "rest-alert", name: "Rest timer alert", importance: 5, vibration: true, visibility: 1 }); await LN.createChannel({ id: "rest-run", name: "Rest timer running", importance: 2 }); await LN.cancel({ notifications: [{ id: RID }, { id: RID + 1 }] }); await LN.schedule({ notifications: [{ id: RID + 1, channelId: "rest-run", title: tr("휴식 중"), body: tr("종료 시각 {0}", new Date(end).toLocaleTimeString(LANG === "en" ? "en-US" : "ko-KR", { hour: "numeric", minute: "2-digit" })) }, { id: RID, channelId: "rest-alert", title: tr("휴식 끝!"), body: tr("다음 세트 가세요 💪"), schedule: { at: new Date(end), allowWhileIdle: true } }] }); } catch (e) {} };
const restCancel = async () => { const LN = CAP(); if (!LN) return; try { await LN.cancel({ notifications: [{ id: RID }, { id: RID + 1 }] }); } catch (e) {} };
const restDone = async () => { const LN = CAP(); if (!LN) return; try { if (document.visibilityState === "visible") { await LN.cancel({ notifications: [{ id: RID }, { id: RID + 1 }] }); await LN.removeAllDeliveredNotifications(); } else await LN.cancel({ notifications: [{ id: RID + 1 }] }); } catch (e) {} };

function ExPicker({ onPick, onClose, init, added, start, fav, recent, toggleFav }) {
  const [cat, setCat] = useState(start || "가슴");
  const [custom, setCustom] = useState(init || "");
  const q = nk(custom);
  const list = q ? Object.values(EX).flat().filter(n => nk(n).includes(q) || nk(tn(n)).includes(q)) : cat === "★" ? fav : cat === "최근" ? recent : cat === "전체" ? [...new Set(Object.values(EX).flat())] : EX[cat];
  const pick = n => { const c = Object.keys(EX).find(k => EX[k].includes(n)) || cat; onPick(n, c === "유산소", cat === "전체" ? cat : c); };
  const lr = useRef();
  useEffect(() => { if (lr.current) lr.current.scrollTop = 0; }, [cat]);
  return (
    <div className="fixed inset-0 z-50 bg-black/70 flex items-end" onClick={onClose}>
      <div className="w-full max-w-xl mx-auto bg-zinc-900 rounded-t-3xl h-[80vh] flex flex-col overflow-hidden" style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }} onClick={e => e.stopPropagation()}>
        <div className="shrink-0 flex items-center justify-between p-4 pb-2"><div className="font-bold">{tr("종목 선택")}</div><button onClick={onClose}><Icon n="x" /></button></div>
        <div className="shrink-0 grid grid-cols-6 gap-1.5 px-4 pb-3">{["★", "최근", "전체", ...Object.keys(EX)].map(c => <button key={c} onClick={() => setCat(c)} className={`h-10 rounded-xl text-sm whitespace-nowrap flex items-center justify-center ${cat === c ? (c === "최근" ? "bg-sky-500" : "bg-amber-500") + " text-black font-semibold" : (c === "★" ? "bg-amber-500/20" : c === "최근" ? "bg-sky-500/20" : "bg-zinc-800") + " text-zinc-300"}`}>{tr(c)}</button>)}</div>
        <div ref={lr} className="flex-1 min-h-0 overflow-y-auto px-4 divide-y divide-zinc-800 border-t border-zinc-800">
          {!list.length && <div className="py-6 text-center text-sm text-zinc-500">{tr("비어 있어요")}</div>}
          {list.map(n => <div key={n} className="flex items-center"><button onClick={() => pick(n)} className="flex-1 text-left py-3">{tn(n)}{added.includes(n) && <span className="ml-2 text-xs text-amber-400">{tr("추가됨")}</span>}</button><button aria-label={tr("즐겨찾기")} onClick={() => toggleFav(n)} className={`px-3 py-3 ${fav.includes(n) ? "text-amber-400" : "text-zinc-600"}`}>★</button></div>)}
        </div>
        <div className="shrink-0 p-4 pt-3 flex gap-2 border-t border-zinc-800">
          <input style={{ textAlign: "left", padding: 10 }} placeholder={tr("검색 또는 직접 입력")} value={custom} onChange={e => setCustom(e.target.value)} />
          <button onClick={() => custom.trim() && pick(Object.values(EX).flat().find(n => nk(n) === nk(custom) || nk(tn(n)) === nk(custom)) || custom.trim())} className="px-4 rounded-lg bg-amber-500 text-black font-semibold shrink-0">{tr("추가")}</button>
        </div>
      </div>
    </div>
  );
}

function Timer({ kick }) {
  const [inp, setInp] = useState("90");
  const [left, setLeft] = useState(null);
  const [run, setRun] = useState(false);
  const [done, setDone] = useState(false);
  const [open, setOpen] = useState(false);
  const end = useRef(0), ctx = useRef(null);
  useEffect(() => {
    if (!run) return;
    const tick = () => { const s = Math.ceil((end.current - Date.now()) / 1000); if (s <= 0) { beep(ctx.current); restDone(); try { window.Notification && Notification.permission === "granted" && new Notification(tr("휴식 끝! 다음 세트 가세요 💪")); } catch (e) {} setDone(true); setRun(false); setLeft(null); setTimeout(() => setDone(false), 4000); } else setLeft(s); };
    tick(); const t = setInterval(tick, 250); document.addEventListener("visibilitychange", tick);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", tick); };
  }, [run]);
  const shown = left ?? (parseInt(inp) || 0);
  const start = fresh => { const l = (fresh === true ? null : left) ?? parseInt(inp); if (!l) return; try { window.Notification && Notification.permission === "default" && Notification.requestPermission(); } catch (e) {} try { const C = window.AudioContext || window.webkitAudioContext; ctx.current = ctx.current || new C(); ctx.current.resume(); } catch (e) {} end.current = Date.now() + l * 1000; restStart(end.current); setDone(false); setLeft(l); setRun(true); };
  const reset = () => { setRun(false); setLeft(null); setDone(false); restCancel(); };
  useEffect(() => { if (kick) start(true); }, [kick]);
  const preset = n => { setInp(String(n)); reset(); setOpen(false); };
  return (
    <div className="fixed bottom-0 inset-x-0 z-30 px-3 pointer-events-none" style={{ paddingBottom: "calc(env(safe-area-inset-bottom,0px) + 8px)" }}>
    <div className={`max-w-xl mx-auto pointer-events-auto rounded-2xl p-3 border shadow-xl ${done ? "bg-amber-500 text-black border-amber-500 animate-pulse" : "bg-zinc-900 border-zinc-800"}`}>
      <div className="flex items-center gap-3">
        <div className="flex-1 min-w-0 flex items-center gap-3">
          <Icon n="timer" s={20} />
          <div className="text-3xl font-bold tabular-nums">{Math.floor(shown/60)}:{String(shown%60).padStart(2,"0")}</div>
          <div className="text-xs opacity-70 truncate">{done ? tr("시간 종료!") : tr("휴식 타이머")}</div>
        </div>
        {run ? <button onClick={() => { setRun(false); restCancel(); }} className="px-6 py-2.5 rounded-xl bg-zinc-700 text-white">{tr("중지")}</button> : <button onClick={() => start()} className="px-6 py-2.5 rounded-xl bg-zinc-800 text-white font-semibold">{tr("시작")}</button>}
        <button aria-label={tr("타이머 설정")} aria-expanded={open} onClick={() => setOpen(o => !o)} className="p-2.5 rounded-xl bg-zinc-800 text-zinc-300"><Icon n={open ? "up" : "down"} s={16} /></button>
      </div>
      {open && <div className="mt-3">
        <div className="flex items-center gap-2">
          <div className="w-24 shrink-0"><input inputMode="numeric" aria-label={tr("휴식 시간(초)")} value={inp} onChange={e => { setInp(e.target.value.replace(/\D/g, "")); reset(); }} /></div>
          <span className="text-xs opacity-70">{tr("초")}</span>
          <button onClick={reset} className="flex-1 py-2 rounded-lg bg-zinc-800 text-white">{tr("초기화")}</button>
        </div>
        <div className="grid grid-cols-5 gap-2 mt-2">{[30,60,90,120,180].map(n => <button key={n} onClick={() => preset(n)} className={`py-2 rounded-lg text-sm ${parseInt(inp) === n ? "bg-zinc-600 text-white" : "bg-zinc-800 text-zinc-300"}`}>{n}{tr("초")}</button>)}</div>
      </div>}
    </div>
    </div>
  );
}

function Confirm({ ask, close }) {

function Summary({ date, log, logs, onClose }) {
  const done = log.exercises.filter(e => e.cardio ? e.sets[0] && e.sets[0].done : e.sets.some(s => s.done));
  const str = done.filter(e => !e.cardio);
  const sets = str.reduce((a, e) => a + e.sets.filter(s => s.done && s.t !== "w").length, 0);
  const prs = str.filter(e => prOf(logs, date, e)).length;
  const ov = overload(logs, date);
  const box = (v, t) => <div className="rounded-xl bg-zinc-800 py-2"><div className="text-lg font-bold">{v}</div><div className="text-xs text-zinc-400">{t}</div></div>;
  return (
    <div className="fixed inset-0 z-50 bg-black/70 flex items-end" onClick={onClose}>
      <div className="w-full max-w-xl mx-auto bg-zinc-900 rounded-t-3xl max-h-[85vh] flex flex-col overflow-hidden" style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }} onClick={e => e.stopPropagation()}>
        <div className="shrink-0 flex items-center justify-between p-4 pb-2"><div><div className="font-bold">{tr("운동 결과")} {ov && "🔥"}{prs > 0 && "🏆"}</div><div className="text-xs text-zinc-400">{date}{log.routine && ` · ${log.routine}`}</div></div><button aria-label={tr("닫기")} onClick={onClose}><Icon n="x" /></button></div>
        <div className="flex-1 min-h-0 overflow-y-auto px-4 pb-4">
          <div className="grid grid-cols-3 gap-2 text-center">{box(`${fmt(vol(log))}${U}`, tr("총 볼륨"))}{box(tr("{0}개", done.length), tr("운동 종목"))}{box(tr("{0}세트", sets), tr("완료 세트"))}</div>
          {!done.length && <div className="py-8 text-center text-sm text-zinc-500">{tr("완료 체크한 세트가 없어요.")}</div>}
          <div className="mt-3 divide-y divide-zinc-800">{done.map((e, i) => e.cardio
            ? <div key={i} className="py-3 flex items-center justify-between"><div className="font-medium text-sm">{tn(e.name)}</div><div className="text-xs text-zinc-400">{tr("{0}분", +e.sets[0].min || 0)}</div></div>
            : <div key={i} className="py-3"><div className="flex items-center justify-between"><div className="font-medium text-sm">{tn(e.name)}{prOf(logs, date, e) && " 🏆"}</div><div className="text-xs text-zinc-400">{fmt(vol({ exercises: [e] }))}{U}</div></div><div className="text-xs text-zinc-400 mt-1">{e.sets.filter(s => s.done).map(s => `${s.t ? s.t.toUpperCase() + " " : ""}${s.w || 0}${U}×${s.r || 0}`).join(" / ")}</div></div>)}</div>
        </div>
      </div>
    </div>
  );
}

function Day({ date, data, setData, onClose, mark }) {
  const log = data.logs[date] || { routine: "", mood: 0, memo: "", exercises: [] };
  const [pick, setPick] = useState(false);
  const [ask, setAsk] = useState(null);
  const [lastCat, setLastCat] = useState("가슴");
  const [showEx, setShowEx] = useState(false);
  const [kick, setKick] = useState(0);
  const [showRes, setShowRes] = useState(false);
  const fav = data.fav || [];
  const toggleFav = n => setData(d => ({ ...d, fav: (d.fav || []).includes(n) ? d.fav.filter(x => x !== n) : [...(d.fav || []), n] }));
  useEffect(() => { if (data.wake === false) return; let wl; const get = async () => { try { wl = await navigator.wakeLock.request("screen"); } catch (e) {} }; get(); const v = () => document.visibilityState === "visible" && get(); document.addEventListener("visibilitychange", v); return () => { document.removeEventListener("visibilitychange", v); try { wl && wl.release(); } catch (e) {} }; }, [data.wake]);
  const addEx = (name, cardio) => { const p = prevEx(data.logs, date, name); save(l => l.exercises.push(cardio ? { name, cardio: true, sets: [{ min: p && p[0].min ? p[0].min : "", done: false }] } : { name, sets: [{ w: p ? p[0].w : "", r: p ? p[0].r : "", done: false }] })); setData(d => ({ ...d, recent: [name, ...(d.recent || []).filter(x => x !== name)].slice(0, 15) })); };
  const save = fn => setData(d => { const l = JSON.parse(JSON.stringify(d.logs[date] || { routine: "", mood: 0, memo: "", exercises: [] })); fn(l); return { ...d, logs: { ...d.logs, [date]: l } }; });
  const close = () => { if (!log.exercises.length && !log.memo && !log.mood && !(log.routine || "").trim()) setData(d => { const logs = { ...d.logs }; delete logs[date]; return { ...d, logs }; }); onClose(); };
  const loadDate = (d, force) => { if (log.exercises.length && !force) { setAsk({ msg: tr("현재 기록을 불러온 기록으로 바꿀까요?"), fn: () => loadDate(d, true) }); return; } const src = data.logs[d]; save(l => { l.routine = l.routine || src.routine; l.exercises = src.exercises.map(e => ({ name: e.name, ...(e.cardio ? { cardio: true } : {}), sets: e.sets.map(s => ({ ...s, done: false })) })); }); setPick(false); };
  const pastDates = Object.keys(data.logs).filter(d => d !== date && data.logs[d].exercises.length).sort().reverse();
  const remove = () => setAsk({ msg: tr("이 날짜의 기록을 삭제할까요?"), fn: () => { mark(tr("기록을 삭제했어요")); setData(d => { const logs = { ...d.logs }; delete logs[date]; return { ...d, logs }; }); onClose(); } });
  return (
    <div className="fixed inset-0 z-40 bg-[#0c0e12] overflow-y-auto" style={{ paddingTop: "env(safe-area-inset-top,0px)" }}>

      </div>
      <div className="rounded-2xl bg-zinc-900 p-3">
        <div className="text-sm font-medium mb-2">{tr("주간 총 볼륨 (최근 8주)")}{Q(tr("주간 볼륨"), [tr("완료한 세트의 무게 × 횟수 합계예요. 웜업은 제외해요."), tr("🔥는 같은 루틴 이름으로 직전보다 볼륨이 늘어난 날이에요. 아래 숫자는 그 성공 횟수예요.")])}</div>
        <Bars v={weeks.map(w => w.v)} labels={weeks.map(w => w.l)} />
        <div className="text-xs text-zinc-400 mt-2">{tr("같은 이름의 운동 기준 과부하 🔥 성공 {0}/{1}회", rOk, routineDates.length)}</div>
      </div>
      <div className="rounded-2xl bg-zinc-900 p-3">
        <select value={sel} onChange={e => setName(e.target.value)} className="w-full bg-zinc-800 rounded-lg p-2.5 text-sm outline-none">{names.map(n => <option key={n} value={n}>{tn(disp[n])} ({tr("{0}회", cnt[n])})</option>)}</select>
        <div className="mt-3 flex items-end justify-between">
          <div><div className="text-xs text-zinc-400">{tr("최근 추정 1RM")}{Q(tr("추정 1RM"), [tr("한 번에 들 수 있는 최대 무게를 세트 기록으로 추정한 값이에요."), tr("무게 × (1 + 횟수 ÷ 30) 공식을 쓰고, 웜업 세트는 제외해요."), tr("12회가 넘는 고반복에서는 오차가 커져요.")])}</div><div className="text-3xl font-bold tabular-nums">{last.rm.toFixed(1)}<span className="text-base font-medium text-zinc-400 ml-1">{U}</span></div></div>
          <div className="text-right"><div className={`text-lg font-bold ${chg > 0 ? "text-amber-400" : "text-zinc-400"}`}>{ses.length > 1 ? (chg > 0 ? "+" : "") + chg.toFixed(1) + "%" : "-"}</div><div className="text-xs text-zinc-400">{tr("첫 기록 대비")}</div></div>
        </div>
        <div className="mt-3 grid grid-cols-2 gap-2 text-center">
          <div className="rounded-xl bg-zinc-800 py-2"><div className="text-lg font-bold">{tot ? Math.round(rate*100) + "%" : "-"}</div><div className="text-xs text-zinc-400">{tr("과부하 성공률")}{Q(tr("과부하 성공률"), [tr("직전 세션보다 추정 1RM 또는 볼륨이 늘어난 세션의 비율이에요."), tr("둘 중 하나만 늘어도 성공으로 세요.")])}</div></div>
          <div className="rounded-xl bg-zinc-800 py-2"><div className="text-lg font-bold">{tr("{0}회", ses.length)}</div><div className="text-xs text-zinc-400">{tr("기록한 세션")}</div></div>
        </div>
        <div className="text-sm mt-3">{verdict}</div>
      </div>
      <div className="rounded-2xl bg-zinc-900 p-3">
        <div className="text-sm font-medium mb-2">{tr("추정 1RM 추이")} ({U}{ses.length > 20 ? ", " + tr("최근 20회") : ""})</div>
        <LineChart key={sel} v={rec.map(x => x.rm)} labels={rec.map(x => md(x.d))} />
      </div>
      <div className="rounded-2xl bg-zinc-900 p-3">
        <div className="text-sm font-medium mb-2">{tr("세션 볼륨")} ({U})</div>
        <Bars key={sel} v={ses.slice(-10).map(x => x.vol)} labels={ses.slice(-10).map(x => md(x.d))} color="#38bdf8" />
      </div>
      <div className="rounded-2xl bg-zinc-900 p-3">
        <div className="text-sm font-medium">{tr("최근 기록")}</div>
        <div className="mt-2 divide-y divide-zinc-800 text-sm">{ses.slice().reverse().slice(0, 6).map(x => <div key={x.d} className="py-2 flex justify-between"><span>{x.d} {x.up && "🔥"}{x.pr && "🏆"}</span><span className="text-zinc-400">1RM {x.rm.toFixed(1)} · {fmt(x.vol)}{U}</span></div>)}</div>
      </div>
      {ask && <Confirm ask={ask} close={() => setAsk(null)} />}
    </div>
  );
}

function App() {
  const [data, setData] = useState(load);
  U = data.unit || "kg";
  LANG = data.lang === "en" ? "en" : "ko";
  INC = data.inc || INC;
  const [undo, setUndo] = useState(null);
  const [warn, setWarn] = useState(LOAD_BAD);
  const armed = useRef(false);
  const mark = msg => { armed.current = false; setUndo({ msg, snap: data }); };
  useEffect(() => { if (!undo) return; if (!armed.current) armed.current = true; else setUndo(null); }, [data]);
  useEffect(() => { if (!undo) return; const t = setTimeout(() => setUndo(null), 6000); return () => clearTimeout(t); }, [undo]);
  useEffect(() => { const L = data.theme === "light"; document.documentElement.dataset.theme = L ? "light" : "dark"; const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = L ? "#f4f4f5" : "#0c0e12"; }, [data.theme]);
  useEffect(() => { document.documentElement.lang = data.lang; document.title = tr("과부하 로그"); }, [data.lang]);
  const [tab, setTab] = useState("cal");
  const [showSet, setShowSet] = useState(false);
  const [date, setDate] = useState(null);
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }, [data]);
  useEffect(() => { try { const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d"); x.fillStyle = "#0c0e12"; x.fillRect(0, 0, 180, 180); x.font = "110px serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("🏋️", 90, 98); const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png"); document.head.appendChild(l); } catch (e) {} }, []);
  const tabs = [["cal", tr("달력"), "cal"], ["st", tr("통계"), "chart"]];
  return (
    <div className="max-w-xl mx-auto px-4 pb-24">
      <div className="pt-4 flex items-center justify-between"><div className="text-xl font-extrabold tracking-tight">{tr("과부하 로그")}</div><button aria-label={tr("설정")} onClick={() => setShowSet(true)} className="p-2 rounded-lg bg-zinc-800 text-zinc-300"><Icon n="gear" /></button></div>
      {tab === "cal" && <Calendar data={data} open={setDate} />}
      {tab === "st" && <Stats data={data} />}
      {date && <Day mark={mark} date={date} data={data} setData={setData} onClose={() => setDate(null)} />}
      {showSet && <div className="fixed inset-0 z-40 bg-[#0c0e12] overflow-y-auto" style={{ paddingTop: "env(safe-area-inset-top,0px)" }}><div className="max-w-xl mx-auto p-4 pb-24"><div className="flex items-center justify-between"><div className="text-lg font-bold">{tr("설정")}</div><button aria-label={tr("닫기")} onClick={() => setShowSet(false)} className="p-2 rounded-lg bg-zinc-800"><Icon n="x" /></button></div><Settings mark={mark} data={data} setData={setData} /></div></div>}
      {undo && <div className="fixed bottom-16 inset-x-0 z-[70] px-4"><div className="max-w-xl mx-auto bg-zinc-800 rounded-xl px-4 py-3 flex items-center justify-between text-sm shadow-lg"><span className="flex-1 min-w-0">{undo.msg}</span><div className="flex items-center gap-3 shrink-0"><button onClick={() => { setData(undo.snap); setUndo(null); }} className="text-amber-400 font-semibold">{tr("되돌리기")}</button><button aria-label={tr("닫기")} onClick={() => setUndo(null)} className="text-zinc-400"><Icon n="x" s={16} /></button></div></div></div>}
      {warn && <Confirm ask={{ msg: tr("저장된 데이터를 읽지 못해 원본을 따로 보관했어요. 설정 화면에서 내보낼 수 있어요."), fn: () => {}, info: true }} close={() => setWarn(false)} />}
      <nav className="fixed bottom-0 inset-x-0 z-30 bg-zinc-950/95 border-t border-zinc-800" style={{ paddingBottom: "env(safe-area-inset-bottom,0px)" }}>
        <div className="max-w-xl mx-auto grid grid-cols-2">
          {tabs.map(([k, t, ic]) => <button key={k} onClick={() => setTab(k)} className={`py-2.5 flex flex-col items-center text-xs gap-0.5 ${tab === k ? "text-amber-400" : "text-zinc-500"}`}><Icon n={ic} />{t}</button>)}
        </div>
      </nav>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
