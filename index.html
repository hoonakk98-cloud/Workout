function Calendar({ data, open }) {

    <div>

        <button aria-label={tr("이전 달")} onClick={() => setCur(new Date(y, m-1, 1))} className="p-2 rounded-lg bg-zinc-800"><Icon n="l" /></button>
        <div className="font-bold text-lg">{LANG === "en" ? new Date(y, m, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }) : `${y}년 ${m+1}월`}</div>

      <div className="grid grid-cols-7 gap-1">
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`, l = data.logs[key];
          return (
            <button key={i} onClick={() => open(key)} className={`min-h-[68px] rounded-lg p-1 text-left flex flex-col ${l ? "bg-zinc-800" : "bg-zinc-900"} ${key === today ? "ring-2 ring-amber-500" : ""}`}>

}

class EB extends React.Component {

      </div>
    );
  }
}
